name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi

      - name: Syntax check
        run: |
          python -m compileall -q src scripts

      - name: Import smoke check
        run: |
          python - <<'PY'
          import importlib
          mods = [
            "src.core.config",
            "src.core.llm",
            "src.core.embeddings",
          ]
          for m in mods:
              importlib.import_module(m)
              print("OK", m)
          PY

      - name: Unit tests (if present)
        run: |
          if ls test*.py tests 2>/dev/null | grep -q .; then
            pip install pytest
            pytest -q
          else
            echo "No tests found; skipping pytest"
          fi
